name: Deploy a Aureo2.0 (producción)

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Subir por FTP
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Desplegar por FTP a Aureo2.0
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          # La cuenta FTP ya está encerrada en public_html/Aureo2.0 (así se
          # creó en cPanel), así que la raíz de esa cuenta YA es esa carpeta.
          # Poner aquí la ruta completa otra vez crearía una subcarpeta
          # duplicada dentro de sí misma.
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/node_modules/**
